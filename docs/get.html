<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get Stat Blitz</title>
  <meta name="description" content="Stat Blitz: Sports Trivia. Spin a team, name a player, build the lineup. Free on iPhone and Android." />
  <meta property="og:title" content="Get Stat Blitz: Sports Trivia" />
  <meta property="og:description" content="Spin a team, name a player, build the lineup. Baseball, basketball and football. Free on iPhone and Android." />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e2e8f0;
      background: radial-gradient(circle at 50% 0%, #16233d 0%, #0a1120 55%, #060a14 100%);
      line-height: 1.5;
      display: flex;
      justify-content: center;
    }
    main { width: 100%; max-width: 440px; padding: 56px 24px 48px; text-align: center; }
    .icon {
      width: 96px; height: 96px; border-radius: 22px; margin: 0 auto 20px;
      background: #0e1729; border: 1px solid #2b3a57;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: 800; letter-spacing: 1px; color: #fff; position: relative;
    }
    .icon::after {
      content: ""; position: absolute; left: 22px; right: 22px; bottom: 20px; height: 5px;
      border-radius: 3px; background: #fbbf24;
    }
    h1 { font-size: 2.4rem; letter-spacing: 0.02em; margin: 0; color: #fff; }
    .tag { color: #fbbf24; font-weight: 600; margin: 6px 0 28px; }
    p.lead { color: #cbd5e1; margin: 0 0 28px; font-size: 0.98rem; }
    a.btn {
      display: block; text-decoration: none; padding: 16px 20px; margin: 12px 0;
      border-radius: 14px; font-size: 1.05rem; font-weight: 600;
      border: 1px solid rgba(255,255,255,0.14); color: #e2e8f0; background: rgba(255,255,255,0.06);
    }
    a.btn small { display: block; font-weight: 400; font-size: 0.78rem; color: #94a3b8; margin-top: 2px; }
    a.btn.primary { background: #fbbf24; color: #1c1403; border-color: #fbbf24; }
    a.btn.primary small { color: #5b4208; }
    .note { margin-top: 28px; font-size: 0.8rem; color: #64748b; }
    .note a { color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">SB</div>
    <h1>STAT BLITZ</h1>
    <p class="tag">Spin a team. Name a player. Build the lineup.</p>
    <p class="lead">A free sports trivia game for baseball, basketball and football fans. No account needed.</p>

    <a class="btn" id="ios" href="https://apps.apple.com/app/stat-blitz-sports-trivia/id6821420153">
      Get it on iPhone
      <small>App Store</small>
    </a>
    <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.jgas1234.statblitz">
      Get it on Android
      <small>Google Play</small>
    </a>
    <a class="btn" href="https://jgas1234.github.io/stat-blitz/">
      Play in your browser
      <small>No download</small>
    </a>

    <p class="note">Questions or a player missing? <a href="support.html">Contact support</a></p>
  </main>

  <script>
    // Highlight the button that matches the visitor's phone.
    (function () {
      var ua = navigator.userAgent || "";
      var target = /iPhone|iPad|iPod/i.test(ua) ? "ios" : /Android/i.test(ua) ? "android" : null;
      if (!target) return;
      var el = document.getElementById(target);
      if (el) el.className += " primary";
    })();
  </script>
</body>
</html>
